name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort nbqa
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        
    - name: Lint with flake8
      run: |
        # Python 파일이 있는 경우에만 실행
        if [ -n "$(find . -name '*.py' -not -path './.git/*')" ]; then
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        fi
      continue-on-error: true
      
    - name: Check code formatting with black
      run: |
        if [ -n "$(find . -name '*.py' -not -path './.git/*')" ]; then
          black --check .
        fi
      continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        # detectron2는 CPU 버전으로 설치 (CI 환경에서)
        pip install 'git+https://github.com/facebookresearch/detectron2.git'
        
    - name: Run tests
      run: |
        # 테스트 파일이 있는 경우에만 실행
        if [ -n "$(find . -name 'test_*.py' -o -name '*_test.py')" ]; then
          pytest --cov=. --cov-report=xml
        else
          echo "No test files found"
        fi
      continue-on-error: true

  notebook-check:
    name: Notebook Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nbconvert nbformat jupyter
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        
    - name: Check notebook syntax
      run: |
        # Jupyter 노트북 파일 검증
        python -c "
        import nbformat
        import sys
        from pathlib import Path
        
        notebooks = list(Path('scripts').glob('*.ipynb'))
        if not notebooks:
            print('No notebooks found')
            sys.exit(0)
            
        errors = []
        for nb_path in notebooks:
            try:
                with open(nb_path, 'r', encoding='utf-8') as f:
                    nbformat.read(f, as_version=4)
                print(f'✓ {nb_path} is valid')
            except Exception as e:
                errors.append(f'{nb_path}: {e}')
                print(f'✗ {nb_path} has errors: {e}')
        
        if errors:
            sys.exit(1)
        "
      continue-on-error: true

